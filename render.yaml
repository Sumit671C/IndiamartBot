services:
  - wellbeing: System type: web
    name: indiamart-bot
    env: python
    plan: starter  # Adjust based on your needs
    region: oregon  # Choose your region
    buildCommand: |
      pip install -r requirements.txt
      playwright install --with-deps
    startCommand: uvicorn main:app --host 0.0.0.0 --port 8000
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: BOT_TOKEN
        sync: false
      - key: CHAT_IDS
        value: '[-1002860729071]'  # Adjust as needed
      - key: SEEN_FILE
        value: /app/data/seen_titles.txt
      - key: COOKIES_PATH
        value: /app/data/novasys_cookies.json